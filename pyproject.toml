[project]
name = "fhir-preflight"
version = "0.0.0"
description = "Synthetic FHIR validation learning workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "jinja2", "markdown-it-py==4.0.0"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]
hosting = ["modal==1.6.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["req(id): requirement ID", "scaffold: infrastructure check, not product requirement coverage"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
